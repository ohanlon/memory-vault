<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cairn spike</title>
  <style>
    body { font: 16px system-ui, sans-serif; background: #1e1f24; color: #e6e6e6; padding: 16px; }
    pre { white-space: pre-wrap; word-break: break-all; background: #2a2c38; padding: 12px; border-radius: 6px; }
    button { font-size: 16px; padding: 10px 16px; margin-right: 8px; }
  </style>
</head>
<body>
  <h2>Cairn mobile spike</h2>
  <p><button id="run">create + list</button></p>
  <pre id="out">waiting…</pre>
  <script src="_framework/hybridwebview.js"></script>
  <script>
    // Same wire format as csharp/src/Cairn.Host/Web/bridge.js, over HybridWebView raw messages.
    var pending = {}, nextId = 1;
    function invoke(channel, args) {
      return new Promise(function (resolve, reject) {
        var id = nextId++;
        pending[id] = { resolve: resolve, reject: reject };
        window.HybridWebView.SendRawMessage(JSON.stringify({ id: id, channel: channel, args: args }));
      });
    }
    window.addEventListener("HybridWebViewMessageReceived", function (e) {
      var msg = JSON.parse(e.detail.message);
      var entry = pending[msg.id];
      if (!entry) return;
      delete pending[msg.id];
      if (msg.ok) entry.resolve(msg.result); else entry.reject(new Error(msg.error));
    });

    var out = document.getElementById("out");
    document.getElementById("run").addEventListener("click", async function () {
      try {
        var name = "Spike " + Date.now();
        await invoke("notesFolders:create", [name]);
        var list = await invoke("notesFolders:list", []);
        out.textContent = "OK\n" + JSON.stringify(list, null, 2);
      } catch (err) {
        out.textContent = "ERROR: " + err.message;
      }
    });
  </script>
</body>
</html>
